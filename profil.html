<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Pati Sağlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1F7F4; --card: #FFFFFF; --ink: #14231F; --ink-soft: #54655D; --ink-faint: #8A9C92;
    --teal: #0B6E6C; --teal-bright: #12968F; --teal-soft: #E1F0EE;
    --green: #6E9B37; --green-soft: #EAF3E1;
    --line: #DCE7E0; --acil: #B8433A; --acil-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .navbar { position: sticky; top: 0; z-index: 20; background: rgba(241, 247, 244, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .navbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; row-gap: 6px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--teal); letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; gap: 16px; }
  .nav-links a { font-size: 13px; font-weight: 500; color: var(--ink-soft); text-decoration: none; white-space: nowrap; }
  .nav-links a:hover { color: var(--teal); }
  @media (max-width: 900px) { .nav-links { display: none; } .mobile-menu-btn { display: block; } }
  .mobile-menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink); padding: 10px 12px; line-height: 1; min-width: 44px; min-height: 44px; }
  .mobile-menu-panel { display: none; flex-direction: column; background: var(--card); border-top: 1px solid var(--line); padding: 6px 24px 10px; }
  .mobile-menu-panel.visible { display: flex; }
  .mobile-menu-panel a { padding: 12px 4px; font-size: 14.5px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .mobile-menu-panel a:last-child { border-bottom: none; }

  .nav-auth { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-auth a, .nav-auth span.action { color: var(--teal-bright); font-weight: 600; text-decoration: none; cursor: pointer; }
  .nav-avatar { width: 38px; height: 38px; border-radius: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); color: var(--teal); font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; text-decoration: none; flex-shrink: 0; border: none; padding: 0; cursor: pointer; }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-wrap { position: relative; }
  .profile-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; overflow: hidden; }
  .profile-dropdown.visible { display: block; }
  .profile-dropdown a, .profile-dropdown .action { display: block; padding: 11px 15px; font-size: 13.5px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); cursor: pointer; }
  .profile-dropdown a:last-child, .profile-dropdown .action:last-child { border-bottom: none; }
  .profile-dropdown a:hover, .profile-dropdown .action:hover { background: var(--teal-soft); color: var(--teal); }
  .profile-dropdown .logout-item { color: var(--acil); }
  .profile-dropdown .logout-item:hover { background: var(--acil-bg); color: var(--acil); }

  .notif-wrap { position: relative; }
  .notif-bell { font-size: 18px; cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; }
  .notif-badge { position: absolute; top: -3px; right: -3px; background: var(--acil); color: #fff; font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 5px; display: none; line-height: 1.3; }
  .notif-badge.visible { display: block; }
  .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 300px; max-height: 340px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; }
  .notif-dropdown.visible { display: block; }
  .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink); line-height: 1.4; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-soft); font-weight: 600; }
  .notif-item .notif-time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 3px; }
  .notif-empty { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  button, a, input, select, textarea { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.1s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeInUp 0.28s ease both; }
  .wrap { animation: fadeInUp 0.35s ease both; }

  .wrap { max-width: 600px; margin: 0 auto; padding: 36px 24px 60px; }

  .profile-header { display: flex; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .profile-avatar-big { width: 76px; height: 76px; border-radius: 100%; background: var(--teal-soft); color: var(--teal); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; flex-shrink: 0; overflow: hidden; }
  .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
  .profile-header-name { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .profile-header-city { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .role-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; }
  .role-badge.admin { background: var(--teal-soft); color: var(--teal); }
  .role-badge.vet { background: var(--green-soft); color: #3F5A22; }

  .section-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  .section-title { font-weight: 600; font-size: 15.5px; margin-bottom: 10px; color: var(--ink); }
  .bio-text { font-size: 14px; color: var(--ink); line-height: 1.6; }

  .pet-list { display: flex; flex-direction: column; gap: 10px; }
  .pet-item { background: var(--paper); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
  .pet-item strong { color: var(--ink); }
  .pet-item span { color: var(--ink-soft); }

  .empty-state { text-align: center; color: var(--ink-faint); font-size: 14px; padding: 30px 20px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M6 18C6 13 10 9 16 9C22 9 26 13 26 18C26 23 21 26 16 26C11 26 6 23 6 18Z" stroke="#0B6E6C" stroke-width="2"/>
        <path d="M11 16L14 20L16 15L18 20L21 16" stroke="#6E9B37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Pati Sağlık</span>
    </a>
    <div class="nav-links">
      <a href="/">Asistana Sor</a>
      <a href="/rehber">Veteriner &amp; petshop</a>
      <a href="/randevu-al">Randevu Al</a>
      <a href="/veteriner-sor">Veterinere Sor</a>
      <a href="/sahiplendir">Sahiplendirme</a>
      <a href="/forum">Forum</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menü">☰</button>
  </div>
  <div class="mobile-menu-panel" id="mobile-menu-panel"></div>
</nav>

<div class="wrap">
  <div id="content"><div class="empty-state"><div class="spinner"></div></div></div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;

function getProfilIdFromUrl() {
  const parts = window.location.pathname.split("/").filter(Boolean);
  return parts[parts.length - 1];
}

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const navAuth = document.getElementById("nav-auth");

  if (session) {
    currentUserId = session.user.id;
    const { data: profile } = await supabaseClient.from("kullanici_profilleri").select("kullanici_adi, admin, veteriner, profil_foto_url").eq("id", session.user.id).single();
    const username = profile ? profile.kullanici_adi : session.user.email;
    const avatarHtml = profile && profile.profil_foto_url
      ? `<img src="${profile.profil_foto_url}" alt="">`
      : username.charAt(0).toUpperCase();
    const adminLink = profile && profile.admin ? `<a href="/admin">Admin paneli</a>` : "";
    const vetLink = profile
      ? (profile.veteriner ? `<a href="/veteriner-takvim">Müsaitlik Takvimim</a>` : `<a href="/veteriner-basvuru">Veteriner misin?</a>`)
      : "";
    navAuth.innerHTML = `
      <div class="profile-wrap" id="profile-wrap">
        <button type="button" class="nav-avatar" id="profile-avatar-btn" title="${username}">${avatarHtml}</button>
        <div class="profile-dropdown" id="profile-dropdown">
          <a href="/hesabim">Hesabım</a>
          ${adminLink}${vetLink}<a href="/randevularim">Randevularım</a>
          <span class="action logout-item" id="logout-action">Çıkış Yap</span>
        </div>
      </div>
      <div class="notif-wrap" id="notif-wrap">
        <span class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge"></span></span>
        <div class="notif-dropdown" id="notif-dropdown"></div>
      </div>`;
    document.getElementById("logout-action").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
    document.getElementById("profile-avatar-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("profile-dropdown").classList.toggle("visible");
    });
    setupNotifications();
  } else {
    navAuth.innerHTML = `<a href="/giris">Giriş yap</a>`;
  }

  document.addEventListener("click", () => {
    const pd = document.getElementById("profile-dropdown");
    if (pd) pd.classList.remove("visible");
    const nd = document.getElementById("notif-dropdown");
    if (nd) nd.classList.remove("visible");
  });

  document.getElementById("mobile-menu-panel").innerHTML = document.querySelector(".nav-links").innerHTML;
  document.getElementById("mobile-menu-btn").addEventListener("click", () => {
    document.getElementById("mobile-menu-panel").classList.toggle("visible");
  });

  await loadProfil();
}

function setupNotifications() {
  document.getElementById("notif-bell").addEventListener("click", async (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById("notif-dropdown");
    const willOpen = !dropdown.classList.contains("visible");
    dropdown.classList.toggle("visible");
    if (willOpen) await loadNotifications();
  });
  refreshNotifBadge();
}

async function refreshNotifBadge() {
  const { count } = await supabaseClient.from("bildirimler").select("id", { count: "exact", head: true }).eq("kullanici_id", currentUserId).eq("okundu", false);
  const badge = document.getElementById("notif-badge");
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.add("visible"); }
  else { badge.classList.remove("visible"); }
}

async function loadNotifications() {
  const dropdown = document.getElementById("notif-dropdown");
  const { data } = await supabaseClient.from("bildirimler").select("*").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(10);
  if (!data || data.length === 0) { dropdown.innerHTML = '<div class="notif-empty">Henüz bildirimin yok.</div>'; return; }
  dropdown.innerHTML = data.map(n => `
    <div class="notif-item ${n.okundu ? "" : "unread"}" data-id="${n.id}" data-link="${n.link || ""}">
      ${n.mesaj}
      <span class="notif-time">${new Date(n.created_at).toLocaleString("tr-TR")}</span>
    </div>
  `).join("");
  dropdown.querySelectorAll(".notif-item").forEach(item => {
    item.addEventListener("click", async () => {
      await supabaseClient.from("bildirimler").update({ okundu: true }).eq("id", item.dataset.id);
      if (item.dataset.link) window.location.href = item.dataset.link;
    });
  });
  refreshNotifBadge();
}

async function loadProfil() {
  const content = document.getElementById("content");
  const profilId = getProfilIdFromUrl();

  const { data: profile, error } = await supabaseClient
    .from("kullanici_profilleri")
    .select("kullanici_adi, admin, veteriner, profil_foto_url, sehir, bio, hayvanlarim")
    .eq("id", profilId)
    .single();

  if (error || !profile) {
    content.innerHTML = '<div class="empty-state">Bu kullanıcı bulunamadı.</div>';
    return;
  }

  const avatarHtml = profile.profil_foto_url
    ? `<img src="${profile.profil_foto_url}" alt="">`
    : profile.kullanici_adi.charAt(0).toUpperCase();

  const badgesHtml = `
    ${profile.admin ? '<span class="role-badge admin">🛡️ Admin</span>' : ""}
    ${profile.veteriner ? '<span class="role-badge vet">✅ Onaylı Veteriner</span>' : ""}
  `;

  const hayvanlar = profile.hayvanlarim || [];
  const petListHtml = hayvanlar.length > 0
    ? `<div class="pet-list">${hayvanlar.map(p => `
        <div class="pet-item"><strong>${p.ad}</strong> <span>${[p.tur, p.yas].filter(Boolean).length ? "· " + [p.tur, p.yas].filter(Boolean).join(" · ") : ""}</span></div>
      `).join("")}</div>`
    : '<div class="empty-state">Henüz hayvan eklenmemiş.</div>';

  content.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar-big">${avatarHtml}</div>
      <div>
        <div class="profile-header-name">${profile.kullanici_adi}</div>
        ${profile.sehir ? `<div class="profile-header-city">📍 ${profile.sehir}</div>` : ""}
        <div class="badge-row">${badgesHtml}</div>
      </div>
    </div>

    ${profile.bio ? `
      <div class="section-card">
        <div class="section-title">Hakkında</div>
        <div class="bio-text">${profile.bio}</div>
      </div>
    ` : ""}

    <div class="section-card">
      <div class="section-title">Hayvanları</div>
      ${petListHtml}
    </div>
  `;
}

initSession();
</script>
</body>
</html>
