<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahiplendirme Destek Sayfası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F5F7F6; --card: #FFFFFF; --ink: #1F2E2C; --ink-soft: #52625F;
    --teal: #1F4B47; --teal-soft: #E4ECEA; --line: #DDE5E2;
    --acil: #B8433A; --acil-bg: #FBEAE8; --gozlemle: #3E7C74; --gozlemle-bg: #E7F1EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', sans-serif; min-height: 100vh;
    display: flex; justify-content: center; padding: 40px 20px 60px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .back-link { display: inline-block; font-size: 13px; color: var(--teal); text-decoration: none; margin-bottom: 16px; font-weight: 600; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); font-weight: 600; margin-bottom: 8px; }
  h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 20px; }

  .session-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .session-banner a { color: var(--teal); font-weight: 600; text-decoration: none; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    padding: 10px 18px; border-radius: 100px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--ink-soft);
  }
  .tab-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .panel { display: none; }
  .panel.active { display: block; }

  .login-prompt { background: var(--teal-soft); border-radius: 10px; padding: 14px 16px; font-size: 13.5px; }
  .login-prompt a { color: var(--teal); font-weight: 600; }

  .form-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  input, textarea {
    width: 100%; font-family: inherit; font-size: 15px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  textarea { min-height: 90px; resize: vertical; }
  .field { margin-bottom: 14px; }
  .submit-btn {
    width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 8px;
    padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 6px;
  }
  .submit-btn:hover { background: #163936; }
  .submit-btn:disabled { background: #9AAEAB; cursor: wait; }

  .success-box { display: none; background: var(--gozlemle-bg); color: var(--gozlemle); border-radius: 8px; padding: 14px; font-size: 13.5px; margin-top: 14px; line-height: 1.5; }
  .success-box.visible { display: block; }
  .error-box { display: none; background: var(--acil-bg); color: var(--acil); border-radius: 8px; padding: 12px; font-size: 13px; margin-top: 14px; }
  .error-box.visible { display: block; }

  .listing-grid { display: flex; flex-direction: column; gap: 12px; }
  .listing-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; }
  .listing-photo { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--teal-soft); flex-shrink: 0; }
  .listing-info { flex: 1; }
  .listing-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
  .listing-meta { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .listing-desc { font-size: 13.5px; color: var(--ink); line-height: 1.5; margin-bottom: 8px; }
  .listing-contact { font-size: 12.5px; color: var(--teal); font-weight: 600; }

  .empty-state { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back-link">← Ana sayfaya dön</a>

  <div class="eyebrow">Sahiplendirme</div>
  <h1>Sahiplendirme destek sayfası</h1>
  <p class="sub">Sahiplendirilecek bir hayvan mı var, yoksa sahiplenmek mi istiyorsun?</p>

  <div class="session-banner" id="session-banner"></div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-listele" data-panel="panel-listele">📋 İlanları Gör</button>
    <button class="tab-btn" id="tab-ekle" data-panel="panel-ekle">➕ İlan Ver</button>
  </div>

  <div class="panel active" id="panel-listele">
    <div class="listing-grid" id="listing-grid">
      <div class="empty-state">Yükleniyor...</div>
    </div>
  </div>

  <div class="panel" id="panel-ekle">
    <div id="ekle-area"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentSession = null;

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentSession = session;

  const banner = document.getElementById("session-banner");
  if (session) {
    const { data: profile } = await supabaseClient
      .from("kullanici_profilleri")
      .select("kullanici_adi")
      .eq("id", session.user.id)
      .single();
    const username = profile ? profile.kullanici_adi : session.user.email;
    banner.innerHTML = `<span>👤 <strong>${username}</strong> olarak giriş yaptın</span><a href="/giris">Hesabım</a>`;
  } else {
    banner.innerHTML = `<span>İlan vermek için giriş yapman gerekiyor</span><a href="/giris">Giriş Yap / Kayıt Ol →</a>`;
  }

  renderEkleArea();
}

function renderEkleArea() {
  const area = document.getElementById("ekle-area");
  if (!currentSession) {
    area.innerHTML = `<div class="login-prompt">İlan vermek için <a href="/giris">giriş yapman</a> gerekiyor.</div>`;
    return;
  }

  area.innerHTML = `
    <div class="form-card">
      <div class="row">
        <div class="field"><label for="hayvan_adi">Hayvanın adı</label><input type="text" id="hayvan_adi" placeholder="Örn: Boncuk"></div>
        <div class="field"><label for="tur">Tür</label><input type="text" id="tur" placeholder="köpek, kedi..."></div>
      </div>
      <div class="row">
        <div class="field"><label for="yas">Yaş (opsiyonel)</label><input type="text" id="yas" placeholder="1 yaşında"></div>
        <div class="field"><label for="cinsiyet">Cinsiyet (opsiyonel)</label><input type="text" id="cinsiyet" placeholder="dişi / erkek"></div>
      </div>
      <div class="field"><label for="aciklama">Açıklama</label><textarea id="aciklama" placeholder="Karakteri, sağlık durumu, neden sahiplendirildiği..."></textarea></div>
      <div class="field"><label for="fotograf_url">Fotoğraf linki (opsiyonel)</label><input type="text" id="fotograf_url" placeholder="https://..."></div>
      <div class="row">
        <div class="field"><label for="konum">Konum</label><input type="text" id="konum" placeholder="Afyonkarahisar"></div>
        <div class="field"><label for="iletisim">İletişim (telefon/whatsapp)</label><input type="text" id="iletisim" placeholder="05xx xxx xx xx"></div>
      </div>
      <button class="submit-btn" id="submit-btn">İlanı Gönder</button>
      <div class="success-box" id="success-box"></div>
      <div class="error-box" id="error-box"></div>
    </div>
  `;

  document.getElementById("submit-btn").addEventListener("click", submitIlan);
}

async function submitIlan() {
  const payload = {
    hayvan_adi: document.getElementById("hayvan_adi").value.trim(),
    tur: document.getElementById("tur").value.trim(),
    yas: document.getElementById("yas").value.trim() || null,
    cinsiyet: document.getElementById("cinsiyet").value.trim() || null,
    aciklama: document.getElementById("aciklama").value.trim(),
    fotograf_url: document.getElementById("fotograf_url").value.trim() || null,
    konum: document.getElementById("konum").value.trim(),
    iletisim: document.getElementById("iletisim").value.trim(),
    ilan_sahibi_id: currentSession.user.id,
    durum: "beklemede",
  };

  if (!payload.hayvan_adi || !payload.tur || !payload.aciklama || !payload.konum || !payload.iletisim) {
    alert("Lütfen zorunlu alanları doldur: hayvan adı, tür, açıklama, konum, iletişim.");
    return;
  }

  const btn = document.getElementById("submit-btn");
  const successBox = document.getElementById("success-box");
  const errorBox = document.getElementById("error-box");

  btn.disabled = true;
  btn.textContent = "Gönderiliyor...";
  successBox.classList.remove("visible");
  errorBox.classList.remove("visible");

  const { error } = await supabaseClient.from("sahiplendirme_ilanlari").insert(payload);

  btn.disabled = false;
  btn.textContent = "İlanı Gönder";

  if (error) {
    errorBox.textContent = "Bir sorun oluştu: " + error.message;
    errorBox.classList.add("visible");
    return;
  }

  successBox.textContent = "İlanınız alındı, onaylandıktan sonra listede görünecek.";
  successBox.classList.add("visible");
  document.querySelectorAll("#panel-ekle input, #panel-ekle textarea").forEach(el => el.value = "");
}

async function loadListings() {
  const grid = document.getElementById("listing-grid");
  grid.innerHTML = '<div class="empty-state">Yükleniyor...</div>';

  const { data, error } = await supabaseClient
    .from("sahiplendirme_ilanlari")
    .select("*")
    .eq("durum", "onaylı")
    .order("created_at", { ascending: false });

  if (error) {
    grid.innerHTML = `<div class="empty-state">Yüklenemedi: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    grid.innerHTML = '<div class="empty-state">Henüz onaylı ilan yok. İlk ilanı sen ver!</div>';
    return;
  }

  grid.innerHTML = "";
  data.forEach(ilan => {
    const card = document.createElement("div");
    card.className = "listing-card";
    const photoHtml = ilan.fotograf_url
      ? `<img class="listing-photo" src="${ilan.fotograf_url}" alt="${ilan.hayvan_adi}">`
      : `<div class="listing-photo"></div>`;

    card.innerHTML = `
      ${photoHtml}
      <div class="listing-info">
        <div class="listing-name">${ilan.hayvan_adi} · ${ilan.tur}</div>
        <div class="listing-meta">${[ilan.yas, ilan.cinsiyet, ilan.konum].filter(Boolean).join(" · ")}</div>
        <div class="listing-desc">${ilan.aciklama}</div>
        <div class="listing-contact">📞 ${ilan.iletisim}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

const tabButtons = document.querySelectorAll(".tab-btn");
const panels = document.querySelectorAll(".panel");
tabButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    tabButtons.forEach(b => b.classList.remove("active"));
    panels.forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.panel).classList.add("active");
    if (btn.dataset.panel === "panel-listele") loadListings();
  });
});

(async function init() {
  await initSession();
  await loadListings();
})();
</script>
</body>
</html>
