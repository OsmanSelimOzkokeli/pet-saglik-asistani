<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müsaitlik Takvimi — Pati Sağlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1F7F4; --card: #FFFFFF; --ink: #14231F; --ink-soft: #54655D; --ink-faint: #8A9C92;
    --teal: #0B6E6C; --teal-bright: #12968F; --teal-soft: #E1F0EE;
    --green: #6E9B37; --green-soft: #EAF3E1;
    --line: #DCE7E0; --acil: #B8433A; --acil-bg: #FBEAE8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .navbar { position: sticky; top: 0; z-index: 20; background: rgba(241, 247, 244, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .navbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--teal); letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .nav-links a:hover { color: var(--teal); }
  .nav-auth { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-auth .who { color: var(--ink); font-weight: 600; }
  .nav-auth a, .nav-auth span.action { color: var(--teal-bright); font-weight: 600; text-decoration: none; cursor: pointer; }
  @media (max-width: 620px) { .nav-links { display: none; } }

  .wrap { max-width: 680px; margin: 0 auto; padding: 36px 24px 60px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 6px; color: var(--teal); }
  .sub { color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; margin-bottom: 26px; }

  .day-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; }
  .day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .day-name { font-weight: 600; font-size: 15px; }
  .slot-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .slot-row input[type="time"] { font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .slot-row span.sep { color: var(--ink-faint); font-size: 13px; }
  .slot-remove-btn { background: none; border: none; color: var(--acil); font-size: 13px; cursor: pointer; font-family: inherit; margin-left: auto; }
  .add-slot-btn { background: var(--teal-soft); color: var(--teal); border: none; border-radius: 8px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .add-slot-btn:hover { background: #D3E9E6; }
  .no-slot-text { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; }

  .save-btn { width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 8px; }
  .save-btn:hover { background: var(--teal-bright); }
  .save-btn:disabled { background: var(--ink-faint); cursor: wait; }

  .msg-box { padding: 12px; border-radius: 10px; font-size: 13.5px; margin-top: 14px; display: none; text-align: center; }
  .msg-box.visible { display: block; }
  .msg-box.success { background: var(--green-soft); color: #3F5A22; }
  .msg-box.error { background: var(--acil-bg); color: var(--acil); }

  .denied-box { background: var(--acil-bg); color: var(--acil); border-radius: 12px; padding: 20px; font-size: 14px; text-align: center; }

  .notif-wrap { position: relative; }
  .notif-bell { font-size: 18px; cursor: pointer; position: relative; padding: 2px 4px; }
  .notif-badge { position: absolute; top: -3px; right: -3px; background: var(--acil); color: #fff; font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 5px; display: none; line-height: 1.3; }
  .notif-badge.visible { display: block; }
  .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 300px; max-height: 340px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; }
  .notif-dropdown.visible { display: block; }
  .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink); line-height: 1.4; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-soft); font-weight: 600; }
  .notif-item .notif-time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 3px; }
  .notif-empty { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  .section-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .section-tab-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .section-tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .randevu-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; }
  .randevu-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .randevu-datetime { font-weight: 600; font-size: 16px; }
  .status-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; }
  .status-badge.bekliyor { background: var(--yakinda-bg, #FBF1E1); color: var(--yakinda, #B9791E); }
  .status-badge.onaylandı { background: var(--green-soft); color: #3F5A22; }
  .status-badge.reddedildi { background: var(--acil-bg); color: var(--acil); }
  .randevu-sebep { font-size: 13.5px; color: var(--ink); margin-bottom: 10px; }
  .action-row { display: flex; gap: 8px; }
  .action-btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .approve-btn { background: var(--teal); color: #fff; }
  .approve-btn:hover { background: var(--teal-bright); }
  .reject-btn { background: var(--acil-bg); color: var(--acil); }
  .reject-btn:hover { background: #F5D5D2; }
  .action-btn:disabled { opacity: 0.5; cursor: wait; }
  .empty-state { text-align: center; color: var(--ink-faint); font-size: 14px; padding: 40px 20px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }

  .calendar-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .calendar-nav-btn { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; width: 32px; height: 32px; font-size: 15px; cursor: pointer; color: var(--ink-soft); }
  .calendar-nav-btn:hover { border-color: var(--teal-bright); color: var(--teal); }
  .calendar-month-label { font-weight: 600; font-size: 14.5px; color: var(--ink); text-transform: capitalize; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-faint); padding-bottom: 4px; text-transform: uppercase; }
  .calendar-cell {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink); position: relative;
    background: var(--paper); border: none; font-family: inherit;
  }
  .calendar-cell:hover { background: var(--teal-soft); }
  .calendar-cell.empty { visibility: hidden; cursor: default; background: none; }
  .calendar-cell.active { background: var(--teal); color: #fff; }
  .calendar-cell .dot { width: 5px; height: 5px; border-radius: 100%; background: var(--acil); position: absolute; bottom: 4px; }
  .calendar-cell.active .dot { background: #fff; }
  .cal-clear-btn { font-size: 12px; color: var(--teal-bright); font-weight: 600; cursor: pointer; margin-top: 10px; display: inline-block; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M6 18C6 13 10 9 16 9C22 9 26 13 26 18C26 23 21 26 16 26C11 26 6 23 6 18Z" stroke="#0B6E6C" stroke-width="2"/>
        <path d="M11 16L14 20L16 15L18 20L21 16" stroke="#6E9B37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Pati Sağlık</span>
    </a>
    <div class="nav-links">
      <a href="/">Asistana Sor</a>
      <a href="/rehber">Veteriner &amp; petshop</a>
      <a href="/randevu-al">Randevu Al</a>
      <a href="/sahiplendir">Sahiplendirme</a>
      <a href="/forum">Forum</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow">Veteriner Paneli</div>
  <h1>Veteriner panelin</h1>
  <p class="sub">Müsaitlik takvimini ayarla, gelen randevu taleplerini onayla ya da reddet.</p>

  <div class="section-tabs" id="section-tabs">
    <button class="section-tab-btn active" data-section="takvim">🗓️ Müsaitlik Takvimi</button>
    <button class="section-tab-btn" data-section="randevular">📋 Randevu İstekleri</button>
  </div>

  <div id="content">
    <div class="msg-box visible">Yükleniyor...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const GUN_ADLARI = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
let currentUserId = null;
let slotData = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const navAuth = document.getElementById("nav-auth");

  if (!session) {
    navAuth.innerHTML = `<a href="/giris">Giriş yap</a>`;
    document.getElementById("content").innerHTML = `<div class="denied-box">Bu sayfayı görmek için giriş yapman gerekiyor.</div>`;
    return;
  }

  currentUserId = session.user.id;
  const { data: profile } = await supabaseClient.from("kullanici_profilleri").select("kullanici_adi, admin, veteriner").eq("id", session.user.id).single();
  const username = profile ? profile.kullanici_adi : session.user.email;
  const adminLink = profile && profile.admin ? `<a href="/admin" style="margin-right:4px;">Admin paneli</a>` : "";
  navAuth.innerHTML = `
    <div class="notif-wrap" id="notif-wrap">
      <span class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge"></span></span>
      <div class="notif-dropdown" id="notif-dropdown"></div>
    </div>
    ${adminLink}<a href="/randevularim" style="margin-right:4px;">Randevularım</a><a href="/hesabim" class="who" style="text-decoration:none;">${username}</a><span class="action" id="logout-action">Çıkış yap</span>`;
  document.getElementById("logout-action").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
  setupNotifications();

  if (!profile || !profile.veteriner) {
    document.getElementById("section-tabs").style.display = "none";
    document.getElementById("content").innerHTML = `<div class="denied-box">Bu sayfa sadece onaylı veterinerler içindir. <a href="/veteriner-basvuru" style="color:inherit;font-weight:700;">Veteriner olarak başvur →</a></div>`;
    return;
  }

  document.querySelectorAll("#section-tabs .section-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#section-tabs .section-tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (btn.dataset.section === "takvim") { loadSlots().then(renderDays); }
      else { loadRandevuIstekleri(); }
    });
  });

  await loadSlots();
  renderDays();
}

function setupNotifications() {
  document.getElementById("notif-bell").addEventListener("click", async (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById("notif-dropdown");
    const willOpen = !dropdown.classList.contains("visible");
    dropdown.classList.toggle("visible");
    if (willOpen) await loadNotifications();
  });
  document.addEventListener("click", () => document.getElementById("notif-dropdown").classList.remove("visible"));
  refreshNotifBadge();
}

async function refreshNotifBadge() {
  const { count } = await supabaseClient.from("bildirimler").select("id", { count: "exact", head: true }).eq("kullanici_id", currentUserId).eq("okundu", false);
  const badge = document.getElementById("notif-badge");
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.add("visible"); }
  else { badge.classList.remove("visible"); }
}

async function loadNotifications() {
  const dropdown = document.getElementById("notif-dropdown");
  const { data } = await supabaseClient.from("bildirimler").select("*").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(10);
  if (!data || data.length === 0) { dropdown.innerHTML = '<div class="notif-empty">Henüz bildirimin yok.</div>'; return; }
  dropdown.innerHTML = data.map(n => `
    <div class="notif-item ${n.okundu ? "" : "unread"}" data-id="${n.id}" data-link="${n.link || ""}">
      ${n.mesaj}
      <span class="notif-time">${new Date(n.created_at).toLocaleString("tr-TR")}</span>
    </div>
  `).join("");
  dropdown.querySelectorAll(".notif-item").forEach(item => {
    item.addEventListener("click", async () => {
      await supabaseClient.from("bildirimler").update({ okundu: true }).eq("id", item.dataset.id);
    });
  });
  refreshNotifBadge();
}

async function loadSlots() {
  const { data } = await supabaseClient.from("veteriner_musaitlik").select("*").eq("veteriner_id", currentUserId);
  slotData = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
  (data || []).forEach(s => {
    slotData[s.gun].push({ id: s.id, baslangic: s.baslangic_saat, bitis: s.bitis_saat });
  });
}

function renderDays() {
  const content = document.getElementById("content");
  content.innerHTML = "";

  const siraliGunler = [1, 2, 3, 4, 5, 6, 0];
  siraliGunler.forEach(gun => {
    const card = document.createElement("div");
    card.className = "day-card";
    card.innerHTML = `
      <div class="day-header">
        <div class="day-name">${GUN_ADLARI[gun]}</div>
        <button type="button" class="add-slot-btn" data-gun="${gun}">+ Saat aralığı ekle</button>
      </div>
      <div class="slots-container" id="slots-gun-${gun}"></div>
    `;
    content.appendChild(card);
    renderSlotsForDay(gun);
  });

  const saveWrap = document.createElement("div");
  saveWrap.innerHTML = `
    <button class="save-btn" id="save-btn">Takvimi Kaydet</button>
    <div class="msg-box" id="msg-box"></div>
  `;
  content.appendChild(saveWrap);

  document.querySelectorAll(".add-slot-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const gun = parseInt(btn.dataset.gun);
      slotData[gun].push({ id: null, baslangic: "09:00", bitis: "17:00" });
      renderSlotsForDay(gun);
    });
  });

  document.getElementById("save-btn").addEventListener("click", saveSlots);
}

function renderSlotsForDay(gun) {
  const container = document.getElementById(`slots-gun-${gun}`);
  if (slotData[gun].length === 0) {
    container.innerHTML = `<div class="no-slot-text">Bu gün için müsaitlik yok.</div>`;
    return;
  }
  container.innerHTML = "";
  slotData[gun].forEach((slot, idx) => {
    const row = document.createElement("div");
    row.className = "slot-row";
    row.innerHTML = `
      <input type="time" value="${slot.baslangic}" data-gun="${gun}" data-idx="${idx}" data-field="baslangic">
      <span class="sep">–</span>
      <input type="time" value="${slot.bitis}" data-gun="${gun}" data-idx="${idx}" data-field="bitis">
      <button type="button" class="slot-remove-btn" data-gun="${gun}" data-idx="${idx}">Kaldır</button>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll("input[type='time']").forEach(input => {
    input.addEventListener("change", () => {
      const g = parseInt(input.dataset.gun), i = parseInt(input.dataset.idx), field = input.dataset.field;
      slotData[g][i][field] = input.value;
    });
  });

  container.querySelectorAll(".slot-remove-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = parseInt(btn.dataset.gun), i = parseInt(btn.dataset.idx);
      slotData[g].splice(i, 1);
      renderSlotsForDay(g);
    });
  });
}

async function saveSlots() {
  const btn = document.getElementById("save-btn");
  const msgBox = document.getElementById("msg-box");
  btn.disabled = true; btn.textContent = "Kaydediliyor...";
  msgBox.classList.remove("visible", "success", "error");

  const { error: deleteError } = await supabaseClient.from("veteriner_musaitlik").delete().eq("veteriner_id", currentUserId);
  if (deleteError) {
    btn.disabled = false; btn.textContent = "Takvimi Kaydet";
    msgBox.textContent = "Kaydedilemedi: " + deleteError.message;
    msgBox.classList.add("visible", "error");
    return;
  }

  const yeniSatirlar = [];
  for (let gun = 0; gun <= 6; gun++) {
    slotData[gun].forEach(slot => {
      yeniSatirlar.push({ veteriner_id: currentUserId, gun, baslangic_saat: slot.baslangic, bitis_saat: slot.bitis });
    });
  }

  if (yeniSatirlar.length > 0) {
    const { error: insertError } = await supabaseClient.from("veteriner_musaitlik").insert(yeniSatirlar);
    if (insertError) {
      btn.disabled = false; btn.textContent = "Takvimi Kaydet";
      msgBox.textContent = "Kaydedilemedi: " + insertError.message;
      msgBox.classList.add("visible", "error");
      return;
    }
  }

  btn.disabled = false; btn.textContent = "Takvimi Kaydet";
  msgBox.textContent = "Takvimin kaydedildi.";
  msgBox.classList.add("visible", "success");

  await loadSlots();
}

let allRandevular = [];
let activeRandevuTab = "bekliyor";
let seciliRandevuTarihi = null;
let rvCalAy = new Date().getMonth();
let rvCalYil = new Date().getFullYear();
const RV_AY_ADLARI = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
const RV_DOW = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];

async function loadRandevuIstekleri() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="calendar-card">
      <div class="calendar-nav">
        <button type="button" class="calendar-nav-btn" id="rv-cal-prev">‹</button>
        <div class="calendar-month-label" id="rv-cal-month-label"></div>
        <button type="button" class="calendar-nav-btn" id="rv-cal-next">›</button>
      </div>
      <div class="calendar-grid" id="rv-calendar-grid"></div>
      <span class="cal-clear-btn" id="rv-cal-clear" style="display:none;">Tarih filtresini temizle</span>
    </div>
    <div class="tabs" id="randevu-tabs" style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="tab-btn active" data-val="bekliyor">Bekleyen</button>
      <button class="tab-btn" data-val="onaylandı">Onaylanan</button>
      <button class="tab-btn" data-val="reddedildi">Reddedilen</button>
      <button class="tab-btn" data-val="tumu">Tümü</button>
    </div>
    <div id="randevu-list"><div class="empty-state">Yükleniyor...</div></div>
  `;

  document.getElementById("rv-cal-prev").addEventListener("click", () => shiftRvCalMonth(-1));
  document.getElementById("rv-cal-next").addEventListener("click", () => shiftRvCalMonth(1));
  document.getElementById("rv-cal-clear").addEventListener("click", () => {
    seciliRandevuTarihi = null;
    document.getElementById("rv-cal-clear").style.display = "none";
    drawRvCalendar();
    renderRandevuIstekleri();
  });

  document.querySelectorAll("#randevu-tabs .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#randevu-tabs .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeRandevuTab = btn.dataset.val;
      renderRandevuIstekleri();
    });
  });

  const { data, error } = await supabaseClient.from("randevular").select("*").eq("veteriner_id", currentUserId).order("tarih", { ascending: true });

  if (error) {
    document.getElementById("randevu-list").innerHTML = `<div class="empty-state">Yüklenemedi: ${error.message}</div>`;
    return;
  }

  allRandevular = data || [];
  drawRvCalendar();
  renderRandevuIstekleri();
}

function shiftRvCalMonth(delta) {
  rvCalAy += delta;
  if (rvCalAy > 11) { rvCalAy = 0; rvCalYil++; }
  if (rvCalAy < 0) { rvCalAy = 11; rvCalYil--; }
  drawRvCalendar();
}

function drawRvCalendar() {
  document.getElementById("rv-cal-month-label").textContent = `${RV_AY_ADLARI[rvCalAy]} ${rvCalYil}`;

  const randevuluGunler = {};
  allRandevular.forEach(r => {
    const [yy, mm, dd] = r.tarih.split("-").map(Number);
    if (yy === rvCalYil && mm - 1 === rvCalAy) {
      randevuluGunler[dd] = (randevuluGunler[dd] || 0) + 1;
    }
  });

  const ilkGun = new Date(rvCalYil, rvCalAy, 1);
  const sonGun = new Date(rvCalYil, rvCalAy + 1, 0);
  const baslangicBosluk = (ilkGun.getDay() + 6) % 7;

  const grid = document.getElementById("rv-calendar-grid");
  grid.innerHTML = "";
  RV_DOW.forEach(d => {
    const el = document.createElement("div");
    el.className = "calendar-dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  for (let i = 0; i < baslangicBosluk; i++) {
    const el = document.createElement("div");
    el.className = "calendar-cell empty";
    grid.appendChild(el);
  }

  for (let gun = 1; gun <= sonGun.getDate(); gun++) {
    const iso = `${rvCalYil}-${String(rvCalAy + 1).padStart(2, "0")}-${String(gun).padStart(2, "0")}`;
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "calendar-cell" + (iso === seciliRandevuTarihi ? " active" : "");
    cell.innerHTML = `${gun}${randevuluGunler[gun] ? '<span class="dot"></span>' : ""}`;
    cell.addEventListener("click", () => {
      seciliRandevuTarihi = iso;
      document.getElementById("rv-cal-clear").style.display = "inline-block";
      drawRvCalendar();
      renderRandevuIstekleri();
    });
    grid.appendChild(cell);
  }
}

function renderRandevuIstekleri() {
  const list = document.getElementById("randevu-list");
  let filtered = activeRandevuTab === "tumu" ? allRandevular : allRandevular.filter(r => r.durum === activeRandevuTab);
  if (seciliRandevuTarihi) {
    filtered = filtered.filter(r => r.tarih === seciliRandevuTarihi);
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">Bu kategoride randevu yok.</div>';
    return;
  }

  list.innerHTML = "";
  filtered.forEach(r => {
    const card = document.createElement("div");
    card.className = "randevu-card";
    const d = new Date(r.tarih + "T00:00:00");
    const tarihStr = d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });

    const actionsHtml = r.durum === "bekliyor" ? `
      <div class="action-row">
        <button class="action-btn approve-btn" data-id="${r.id}" data-action="onaylandı">Onayla</button>
        <button class="action-btn reject-btn" data-id="${r.id}" data-action="reddedildi">Reddet</button>
      </div>
    ` : "";

    card.innerHTML = `
      <div class="randevu-top">
        <div class="randevu-datetime">${tarihStr} · ${r.saat}</div>
        <span class="status-badge ${r.durum}">${r.durum}</span>
      </div>
      <div class="randevu-sebep">${r.sebep}</div>
      ${actionsHtml}
    `;
    list.appendChild(card);
  });

  list.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", () => updateRandevuDurum(btn.dataset.id, btn.dataset.action, btn));
  });
}

async function updateRandevuDurum(id, yeniDurum, btnEl) {
  const card = btnEl.closest(".randevu-card");
  card.querySelectorAll(".action-btn").forEach(b => b.disabled = true);

  const { error } = await supabaseClient.from("randevular").update({ durum: yeniDurum }).eq("id", id);

  if (error) {
    alert("Güncellenemedi: " + error.message);
    card.querySelectorAll(".action-btn").forEach(b => b.disabled = false);
    return;
  }

  const item = allRandevular.find(r => r.id === id);
  if (item) item.durum = yeniDurum;
  renderRandevuIstekleri();
}

initSession();
