<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veteriner Olarak Katıl — Pati Sağlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1F7F4; --card: #FFFFFF; --ink: #14231F; --ink-soft: #54655D; --ink-faint: #8A9C92;
    --teal: #0B6E6C; --teal-bright: #12968F; --teal-soft: #E1F0EE;
    --green: #6E9B37; --green-soft: #EAF3E1;
    --line: #DCE7E0; --acil: #B8433A; --acil-bg: #FBEAE8; --yakinda: #B9791E; --yakinda-bg: #FBF1E1;
  }
  * { box-sizing: border-box; }
  /* Genel akıcılık: buton/link/form geçişleri yumuşat */
  button, a, input, select, textarea, .filter-chip, .tab-btn, .calendar-cell, .quick-link {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  button:active, .filter-chip:active, .tab-btn:active { transform: scale(0.97); }

  /* Yükleniyor spinner'ı */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
  .spinner-inline { width: 15px; height: 15px; border-width: 2px; display: inline-block; vertical-align: middle; margin: 0 6px 0 0; }

  /* İçerik belirdiğinde hafif animasyon */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeInUp 0.28s ease both; }
  .wrap { animation: fadeInUp 0.35s ease both; }

  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .navbar { position: sticky; top: 0; z-index: 20; background: rgba(241, 247, 244, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .navbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--teal); letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .nav-links a:hover { color: var(--teal); }
  .nav-auth { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-avatar { width: 30px; height: 30px; border-radius: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); color: var(--teal); font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px; text-decoration: none; flex-shrink: 0; }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .notif-wrap { position: relative; }
  .notif-bell { font-size: 18px; cursor: pointer; position: relative; padding: 2px 4px; }
  .notif-badge { position: absolute; top: -3px; right: -3px; background: var(--acil); color: #fff; font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 5px; display: none; line-height: 1.3; }
  .notif-badge.visible { display: block; }
  .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 300px; max-height: 340px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; }
  .notif-dropdown.visible { display: block; }
  .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink); line-height: 1.4; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-soft); font-weight: 600; }
  .notif-item .notif-time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 3px; }
  .notif-empty { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 13px; }
  .nav-auth .who { color: var(--ink); font-weight: 600; }
  .nav-auth a, .nav-auth span.action { color: var(--teal-bright); font-weight: 600; text-decoration: none; cursor: pointer; }
  @media (max-width: 620px) { .nav-links { display: none; } .mobile-menu-btn { display: block; } }
  .mobile-menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink); padding: 4px 10px; line-height: 1; }
  .mobile-menu-panel { display: none; flex-direction: column; background: var(--card); border-top: 1px solid var(--line); padding: 6px 24px 10px; }
  .mobile-menu-panel.visible { display: flex; }
  .mobile-menu-panel a { padding: 12px 4px; font-size: 14.5px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .mobile-menu-panel a:last-child { border-bottom: none; }
  .mobile-menu-panel a.current { color: var(--teal); }
  .navbar-inner { flex-wrap: wrap; row-gap: 6px; }
  @media (max-width: 480px) { input, select, textarea { font-size: 16px !important; } }


  .wrap { max-width: 560px; margin: 0 auto; padding: 36px 24px 60px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; margin: 0 0 6px; color: var(--teal); }
  .sub { color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; margin-bottom: 26px; }

  .form-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
  .field .hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 4px; }
  input, textarea { width: 100%; font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  input:focus, textarea:focus { outline: 2px solid var(--teal-bright); outline-offset: 1px; }
  textarea { min-height: 70px; resize: vertical; }

  .submit-btn { width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 6px; }
  .submit-btn:hover { background: var(--teal-bright); }
  .submit-btn:disabled { background: var(--ink-faint); cursor: wait; }

  .msg-box { padding: 12px; border-radius: 10px; font-size: 13.5px; margin-top: 14px; display: none; }
  .msg-box.visible { display: block; }
  .msg-box.success { background: var(--green-soft); color: #3F5A22; }
  .msg-box.error { background: var(--acil-bg); color: var(--acil); }

  .status-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; }
  .status-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 100px; margin-bottom: 12px; }
  .status-badge.beklemede { background: var(--yakinda-bg); color: var(--yakinda); }
  .status-badge.onaylı { background: var(--green-soft); color: #3F5A22; }
  .status-badge.reddedildi { background: var(--acil-bg); color: var(--acil); }
  .status-text { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }

  .denied-box { background: var(--acil-bg); color: var(--acil); border-radius: 12px; padding: 20px; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M6 18C6 13 10 9 16 9C22 9 26 13 26 18C26 23 21 26 16 26C11 26 6 23 6 18Z" stroke="#0B6E6C" stroke-width="2"/>
        <path d="M11 16L14 20L16 15L18 20L21 16" stroke="#6E9B37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Pati Sağlık</span>
    </a>
    <div class="nav-links">
      <a href="/">Asistana Sor</a>
      <a href="/rehber">Veteriner &amp; petshop</a>
      <a href="/randevu-al">Randevu Al</a>
      <a href="/veteriner-sor">Veterinere Sor</a>
      <a href="/sahiplendir">Sahiplendirme</a>
      <a href="/forum">Forum</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menü">☰</button>
  </div>
  <div class="mobile-menu-panel" id="mobile-menu-panel"></div>
</nav>

<div class="wrap">
  <div class="eyebrow">Veterinerler için</div>
  <h1>Pati Sağlık'a veteriner olarak katıl</h1>
  <p class="sub">Onaylanan veterinerler platform üzerinden randevu alabilir ve hayvan sahiplerinin sorularını cevaplayabilir.</p>

  <div id="content">
    <div class="empty-state"><div class="spinner"></div></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const navAuth = document.getElementById("nav-auth");

  if (!session) {
    navAuth.innerHTML = `<a href="/giris">Giriş yap</a>`;
    document.getElementById("content").innerHTML = `<div class="denied-box">Başvuru yapmak için önce giriş yapman gerekiyor. <a href="/giris" style="color:inherit;font-weight:700;">Giriş yap →</a></div>`;
    return;
  }

  currentUserId = session.user.id;
  const { data: profile } = await supabaseClient.from("kullanici_profilleri").select("kullanici_adi, admin, veteriner, profil_foto_url").eq("id", session.user.id).single();
  const username = profile ? profile.kullanici_adi : session.user.email;
    const avatarHtml = profile && profile.profil_foto_url
      ? `<img src="${profile.profil_foto_url}" alt="">`
      : username.charAt(0).toUpperCase();
  const adminLink = profile && profile.admin ? `<a href="/admin" style="margin-right:4px;">Admin paneli</a>` : "";
  navAuth.innerHTML = `
    <div class="notif-wrap" id="notif-wrap">
      <span class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge"></span></span>
      <div class="notif-dropdown" id="notif-dropdown"></div>
    </div>
    ${adminLink}<a href="/randevularim" style="margin-right:4px;">Randevularım</a><span class="action" id="logout-action">Çıkış yap</span><a href="/hesabim" class="nav-avatar" title="${username}">${avatarHtml}</a>`;
  document.getElementById("logout-action").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
  setupNotifications();

  if (profile && profile.veteriner) {
    document.getElementById("content").innerHTML = `
      <div class="status-card">
        <div class="status-badge onaylı">Onaylı Veteriner</div>
        <div class="status-text">Zaten onaylı bir veterinersin. <a href="/veteriner-takvim" style="color:var(--teal-bright);font-weight:700;">Müsaitlik takvimini ayarla →</a></div>
      </div>`;
    return;
  }

  const { data: existing } = await supabaseClient.from("veteriner_basvurulari").select("*").eq("kullanici_id", session.user.id).order("created_at", { ascending: false }).limit(1).maybeSingle();

  if (existing) {
    renderStatus(existing);
  } else {
    renderForm();
  }
}

function renderStatus(basvuru) {
  const messages = {
    beklemede: "Başvurun alındı, inceleniyor. Onaylanınca bu sayfa güncellenecek.",
    onaylı: "Tebrikler, başvurun onaylandı!",
    reddedildi: "Başvurun şu an için onaylanmadı. Bilgilerini güncelleyip yeniden başvurabilirsin.",
  };
  document.getElementById("content").innerHTML = `
    <div class="status-card">
      <div class="status-badge ${basvuru.durum}">${basvuru.durum}</div>
      <div class="status-text">${messages[basvuru.durum]}</div>
    </div>
    ${basvuru.durum === "reddedildi" ? '<div style="text-align:center;margin-top:16px;"><span class="action" id="retry-btn" style="color:var(--teal-bright);font-weight:600;cursor:pointer;">Yeniden başvur</span></div>' : ""}
  `;
  if (basvuru.durum === "reddedildi") {
    document.getElementById("retry-btn").addEventListener("click", renderForm);
  }
}

function renderForm() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="form-card">
      <div class="field"><label for="klinik_adi">Klinik adı</label><input type="text" id="klinik_adi" placeholder="Örn: Afyon Pati Veteriner Kliniği"></div>
      <div class="field"><label for="adres">Klinik adresi</label><input type="text" id="adres" placeholder="Şehir, ilçe, açık adres"></div>
      <div class="field"><label for="telefon">Telefon</label><input type="text" id="telefon" placeholder="05xx xxx xx xx"></div>
      <div class="field"><label for="uzmanlik">Uzmanlık alanı (opsiyonel)</label><input type="text" id="uzmanlik" placeholder="Örn: Küçük hayvan cerrahisi"></div>
      <div class="field">
        <label for="diploma_no">Diploma / oda sicil no (opsiyonel)</label>
        <input type="text" id="diploma_no" placeholder="Doğrulama için">
        <div class="hint">Bu bilgi sadece admin onayı için kullanılır, herkese açık gösterilmez.</div>
      </div>
      <button class="submit-btn" id="submit-btn">Başvuruyu Gönder</button>
      <div class="msg-box" id="msg-box"></div>
    </div>
  `;
  document.getElementById("submit-btn").addEventListener("click", submitBasvuru);
}

async function submitBasvuru() {
  const klinik_adi = document.getElementById("klinik_adi").value.trim();
  const adres = document.getElementById("adres").value.trim();
  const telefon = document.getElementById("telefon").value.trim();
  const uzmanlik = document.getElementById("uzmanlik").value.trim() || null;
  const diploma_no = document.getElementById("diploma_no").value.trim() || null;

  const msgBox = document.getElementById("msg-box");
  msgBox.classList.remove("visible", "success", "error");

  if (!klinik_adi || !adres || !telefon) {
    msgBox.textContent = "Lütfen klinik adı, adres ve telefon alanlarını doldur.";
    msgBox.classList.add("visible", "error");
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Gönderiliyor...";

  const { error } = await supabaseClient.from("veteriner_basvurulari").insert({
    kullanici_id: currentUserId, klinik_adi, adres, telefon, uzmanlik, diploma_no,
  });

  btn.disabled = false; btn.textContent = "Başvuruyu Gönder";

  if (error) {
    msgBox.textContent = "Bir sorun oluştu: " + error.message;
    msgBox.classList.add("visible", "error");
    return;
  }

  renderStatus({ durum: "beklemede" });
}

function setupNotifications() {
  document.getElementById("notif-bell").addEventListener("click", async (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById("notif-dropdown");
    const willOpen = !dropdown.classList.contains("visible");
    dropdown.classList.toggle("visible");
    if (willOpen) await loadNotifications();
  });
  document.addEventListener("click", () => document.getElementById("notif-dropdown").classList.remove("visible"));
  refreshNotifBadge();
}

async function refreshNotifBadge() {
  const { count } = await supabaseClient.from("bildirimler").select("id", { count: "exact", head: true }).eq("kullanici_id", currentUserId).eq("okundu", false);
  const badge = document.getElementById("notif-badge");
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.add("visible"); }
  else { badge.classList.remove("visible"); }
}

async function loadNotifications() {
  const dropdown = document.getElementById("notif-dropdown");
  const { data } = await supabaseClient.from("bildirimler").select("*").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(10);
  if (!data || data.length === 0) { dropdown.innerHTML = '<div class="notif-empty">Henüz bildirimin yok.</div>'; return; }
  dropdown.innerHTML = data.map(n => `
    <div class="notif-item ${n.okundu ? "" : "unread"}" data-id="${n.id}" data-link="${n.link || ""}">
      ${n.mesaj}
      <span class="notif-time">${new Date(n.created_at).toLocaleString("tr-TR")}</span>
    </div>
  `).join("");
  dropdown.querySelectorAll(".notif-item").forEach(item => {
    item.addEventListener("click", async () => {
      await supabaseClient.from("bildirimler").update({ okundu: true }).eq("id", item.dataset.id);
      if (item.dataset.link) window.location.href = item.dataset.link;
    });
  });
  refreshNotifBadge();
}

document.getElementById("mobile-menu-panel").innerHTML = document.querySelector(".nav-links").innerHTML;
document.getElementById("mobile-menu-btn").addEventListener("click", () => {
  document.getElementById("mobile-menu-panel").classList.toggle("visible");
});

initSession();
</script>
</body>
</html>
