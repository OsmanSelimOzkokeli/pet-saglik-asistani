<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesabım — Pati Sağlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1F7F4; --card: #FFFFFF; --ink: #14231F; --ink-soft: #54655D; --ink-faint: #8A9C92;
    --teal: #0B6E6C; --teal-bright: #12968F; --teal-soft: #E1F0EE;
    --green: #6E9B37; --green-soft: #EAF3E1;
    --line: #DCE7E0; --acil: #B8433A; --acil-bg: #FBEAE8; --yakinda: #B9791E; --yakinda-bg: #FBF1E1;
  }
  * { box-sizing: border-box; }
  /* Genel akıcılık: buton/link/form geçişleri yumuşat */
  button, a, input, select, textarea, .filter-chip, .tab-btn, .calendar-cell, .quick-link {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:active, .filter-chip:active, .tab-btn:active { transform: scale(0.97); }

  /* Yükleniyor spinner'ı */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
  .spinner-inline { width: 15px; height: 15px; border-width: 2px; display: inline-block; vertical-align: middle; margin: 0 6px 0 0; }

  /* İçerik belirdiğinde hafif animasyon */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeInUp 0.28s ease both; }
  .wrap { animation: fadeInUp 0.35s ease both; }

  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .navbar { position: sticky; top: 0; z-index: 20; background: rgba(241, 247, 244, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .navbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--teal); letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; gap: 20px; }
  .nav-links a { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .nav-links a:hover { color: var(--teal); }
  .nav-auth { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-avatar { width: 38px; height: 38px; border-radius: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); color: var(--teal); font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; text-decoration: none; flex-shrink: 0; border: none; padding: 0; cursor: pointer; }
  .profile-wrap { position: relative; }
  .profile-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; overflow: hidden; }
  .profile-dropdown.visible { display: block; }
  .profile-dropdown a, .profile-dropdown .action { display: block; padding: 11px 15px; font-size: 13.5px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); cursor: pointer; }
  .profile-dropdown a:last-child, .profile-dropdown .action:last-child { border-bottom: none; }
  .profile-dropdown a:hover, .profile-dropdown .action:hover { background: var(--teal-soft); color: var(--teal); }
  .profile-dropdown .logout-item { color: var(--acil); }
  .profile-dropdown .logout-item:hover { background: var(--acil-bg); color: var(--acil); }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .nav-auth .who { color: var(--ink); font-weight: 600; }
  .nav-auth a, .nav-auth span.action { color: var(--teal-bright); font-weight: 600; text-decoration: none; cursor: pointer; }
  @media (max-width: 760px) { .nav-links { display: none; } .mobile-menu-btn { display: block; } }
  .mobile-menu-btn { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink); padding: 10px 12px; line-height: 1; min-width: 44px; min-height: 44px; }
  .mobile-menu-panel { display: none; flex-direction: column; background: var(--card); border-top: 1px solid var(--line); padding: 6px 24px 10px; }
  .mobile-menu-panel.visible { display: flex; }
  .mobile-menu-panel a { padding: 12px 4px; font-size: 14.5px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  .mobile-menu-panel a:last-child { border-bottom: none; }
  .mobile-menu-panel a.current { color: var(--teal); }
  .navbar-inner { flex-wrap: wrap; row-gap: 6px; }
  @media (max-width: 480px) { input, select, textarea { font-size: 16px !important; } }


  .notif-wrap { position: relative; }
  .notif-bell { font-size: 18px; cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; }
  .notif-badge { position: absolute; top: -3px; right: -3px; background: var(--acil); color: #fff; font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 5px; display: none; line-height: 1.3; }
  .notif-badge.visible { display: block; }
  .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 300px; max-height: 340px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; }
  .notif-dropdown.visible { display: block; }
  .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink); line-height: 1.4; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-soft); font-weight: 600; }
  .notif-item .notif-time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 3px; }
  .notif-empty { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 36px 24px 60px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; margin: 0 0 6px; color: var(--teal); }
  .sub { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 26px; }

  .profile-header { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; }
  .avatar-circle { width: 52px; height: 52px; border-radius: 100%; background: var(--teal-soft); color: var(--teal); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; flex-shrink: 0; overflow: hidden; position: relative; }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-actions { display: flex; flex-direction: column; gap: 12px; }

  .bg-preview-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .bg-preview-box { width: 90px; height: 68px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); background-size: cover; background-position: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 11px; text-align: center; }
  .bg-preview-actions { display: flex; flex-direction: column; gap: 8px; }
  .avatar-action-btn { font-size: 12px; font-weight: 600; color: var(--teal-bright); cursor: pointer; background: none; border: none; font-family: inherit; padding: 6px 2px; text-align: left; min-height: 32px; }
  .avatar-action-btn.danger { color: var(--acil); }

  .cooldown-note { font-size: 12px; color: var(--yakinda); background: var(--yakinda-bg); border-radius: 8px; padding: 9px 11px; margin-bottom: 12px; }

  .danger-zone { border-color: var(--acil-bg); }
  .danger-zone .section-title { color: var(--acil); }
  .danger-btn { background: var(--acil-bg); color: var(--acil); border: none; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .danger-btn:hover { background: #F5D5D2; }
  .profile-header-info { flex: 1; min-width: 0; }
  .profile-header-name { font-weight: 600; font-size: 17px; margin-bottom: 2px; }
  .profile-header-email { font-size: 13px; color: var(--ink-soft); }
  .profile-header-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

  .badge-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .role-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 100px; text-decoration: none; }
  .role-badge.admin { background: var(--teal-soft); color: var(--teal); }
  .role-badge.vet-onayli { background: var(--green-soft); color: #3F5A22; }
  .role-badge.vet-beklemede { background: var(--yakinda-bg); color: var(--yakinda); }
  .role-badge.vet-yok { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }

  .section-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  .section-title { font-weight: 600; font-size: 15.5px; margin-bottom: 4px; }
  .section-desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); min-height: 80px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--teal-bright); outline-offset: 1px; }

  .autocomplete-wrap { position: relative; }
  .autocomplete-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    max-height: 220px; overflow-y: auto; display: none;
    box-shadow: 0 8px 20px rgba(20, 35, 31, 0.12);
  }
  .autocomplete-list.visible { display: block; }
  .autocomplete-item { padding: 9px 13px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .autocomplete-item:hover { background: var(--teal-soft); }

  .pet-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .pet-item { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 10px; padding: 10px 12px; }
  .pet-item-info { flex: 1; font-size: 13.5px; }
  .pet-item-info strong { color: var(--ink); }
  .pet-item-info span { color: var(--ink-soft); }
  .pet-remove-btn { background: none; border: none; color: var(--acil); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 6px 8px; }
  .pet-add-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 8px; }
  @media (max-width: 560px) { .pet-add-row { grid-template-columns: 1fr 1fr; } }
  .pet-add-row input { font-size: 13.5px; padding: 9px 10px; }
  .pet-add-btn { background: var(--teal-soft); color: var(--teal); border: none; border-radius: 9px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .pet-add-btn:hover { background: #D3E9E6; }
  input { width: 100%; font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  input:focus { outline: 2px solid var(--teal-bright); outline-offset: 1px; }
  input:disabled { color: var(--ink-faint); cursor: not-allowed; }

  .save-btn { background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .save-btn:hover { background: var(--teal-bright); }
  .save-btn:disabled { background: var(--ink-faint); cursor: wait; }

  .msg-box { padding: 11px; border-radius: 10px; font-size: 13px; margin-top: 12px; display: none; }
  .msg-box.visible { display: block; }
  .msg-box.success { background: var(--green-soft); color: #3F5A22; }
  .msg-box.error { background: var(--acil-bg); color: var(--acil); }

  .quick-links { display: flex; flex-direction: column; gap: 2px; }
  .quick-link { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .quick-link:last-child { border-bottom: none; }
  .quick-link:hover { color: var(--teal); }
  .quick-link .arrow { color: var(--ink-faint); }

  .signout-btn { width: 100%; background: var(--acil-bg); color: var(--acil); border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .signout-btn:hover { background: #F5D5D2; }

  .denied-box { background: var(--acil-bg); color: var(--acil); border-radius: 12px; padding: 20px; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M6 18C6 13 10 9 16 9C22 9 26 13 26 18C26 23 21 26 16 26C11 26 6 23 6 18Z" stroke="#0B6E6C" stroke-width="2"/>
        <path d="M11 16L14 20L16 15L18 20L21 16" stroke="#6E9B37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Pati Sağlık</span>
    </a>
    <div class="nav-links">
      <a href="/">Asistana Sor</a>
      <a href="/rehber">Veteriner &amp; petshop</a>
      <a href="/randevu-al">Randevu Al</a>
      <a href="/veteriner-sor">Veterinere Sor</a>
      <a href="/sahiplendir">Sahiplendirme</a>
      <a href="/forum">Forum</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>

  </div>
  <div class="mobile-menu-panel" id="mobile-menu-panel"></div>
</nav>

<div class="wrap">
  <div class="eyebrow">Hesap</div>
  <h1>Hesabım</h1>
  <p class="sub">Profil bilgilerini ve hesap ayarlarını buradan yönetebilirsin.</p>

  <div id="content"><div class="section-card" style="text-align:center;"><div class="spinner"></div></div></div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;
let currentUserEmail = null;

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const navAuth = document.getElementById("nav-auth");

  if (!session) {
    navAuth.innerHTML = `<a href="/giris">Giriş yap</a>`;
    document.getElementById("content").innerHTML = `<div class="denied-box">Hesap ayarlarını görmek için giriş yapman gerekiyor.</div>`;
    return;
  }

  currentUserId = session.user.id;
  currentUserEmail = session.user.email;

  const { data: profile } = await supabaseClient.from("kullanici_profilleri").select("kullanici_adi, admin, veteriner, profil_foto_url, kullanici_adi_degisim_tarihi, sehir, bio, hayvanlarim, arka_plan_url").eq("id", session.user.id).single();
  const username = profile ? profile.kullanici_adi : session.user.email;
    const avatarHtml = profile && profile.profil_foto_url
      ? `<img src="${profile.profil_foto_url}" alt="">`
      : username.charAt(0).toUpperCase();
  const adminLink = profile && profile.admin ? `<a href="/admin" style="margin-right:4px;">Admin paneli</a>` : "";
  const vetLink = profile
    ? (profile.veteriner
        ? `<a href="/veteriner-takvim" style="margin-right:4px;">Müsaitlik Takvimim</a>`
        : `<a href="/veteriner-basvuru" style="margin-right:4px;">Veteriner misin?</a>`)
    : "";
  navAuth.innerHTML = `
    <div class="profile-wrap" id="profile-wrap">
      <button type="button" class="nav-avatar" id="profile-avatar-btn" title="${username}">${avatarHtml}</button>
      <div class="profile-dropdown" id="profile-dropdown">
        <a href="/hesabim">Hesabım</a>
        ${adminLink}${vetLink}<a href="/randevularim">Randevularım</a>
        <span class="action logout-item" id="logout-action">Çıkış Yap</span>
      </div>
    </div>
    <div class="notif-wrap" id="notif-wrap">
      <span class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge"></span></span>
      <div class="notif-dropdown" id="notif-dropdown"></div>
    </div>`;
  document.getElementById("profile-avatar-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("profile-dropdown").classList.toggle("visible");
  });
  document.addEventListener("click", () => {
    const pd = document.getElementById("profile-dropdown");
    if (pd) pd.classList.remove("visible");
  });
  document.getElementById("logout-action").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
  setupNotifications();

  await renderContent(profile, session);
}

function setupNotifications() {
  document.getElementById("notif-bell").addEventListener("click", async (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById("notif-dropdown");
    const willOpen = !dropdown.classList.contains("visible");
    dropdown.classList.toggle("visible");
    if (willOpen) await loadNotifications();
  });
  document.addEventListener("click", () => document.getElementById("notif-dropdown").classList.remove("visible"));
  refreshNotifBadge();
}

async function refreshNotifBadge() {
  const { count } = await supabaseClient.from("bildirimler").select("id", { count: "exact", head: true }).eq("kullanici_id", currentUserId).eq("okundu", false);
  const badge = document.getElementById("notif-badge");
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.add("visible"); }
  else { badge.classList.remove("visible"); }
}

async function loadNotifications() {
  const dropdown = document.getElementById("notif-dropdown");
  const { data } = await supabaseClient.from("bildirimler").select("*").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(10);
  if (!data || data.length === 0) { dropdown.innerHTML = '<div class="notif-empty">Henüz bildirimin yok.</div>'; return; }
  dropdown.innerHTML = data.map(n => `
    <div class="notif-item ${n.okundu ? "" : "unread"}" data-id="${n.id}" data-link="${n.link || ""}">
      ${n.mesaj}
      <span class="notif-time">${new Date(n.created_at).toLocaleString("tr-TR")}</span>
    </div>
  `).join("");
  dropdown.querySelectorAll(".notif-item").forEach(item => {
    item.addEventListener("click", async () => {
      await supabaseClient.from("bildirimler").update({ okundu: true }).eq("id", item.dataset.id);
      if (item.dataset.link) window.location.href = item.dataset.link;
    });
  });
  refreshNotifBadge();
}

async function renderContent(profile, session) {
  const content = document.getElementById("content");
  const username = profile ? profile.kullanici_adi : session.user.email;
  const uyeOlmaTarihi = new Date(session.user.created_at).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });

  let vetBadgeHtml = `<a href="/veteriner-basvuru" class="role-badge vet-yok">🩺 Veteriner değilsin</a>`;
  if (profile && profile.veteriner) {
    vetBadgeHtml = `<a href="/veteriner-takvim" class="role-badge vet-onayli">✅ Onaylı Veteriner</a>`;
  } else {
    const { data: basvuru } = await supabaseClient.from("veteriner_basvurulari").select("durum").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(1).maybeSingle();
    if (basvuru && basvuru.durum === "beklemede") {
      vetBadgeHtml = `<a href="/veteriner-basvuru" class="role-badge vet-beklemede">⏳ Başvuru İnceleniyor</a>`;
    } else if (basvuru && basvuru.durum === "reddedildi") {
      vetBadgeHtml = `<a href="/veteriner-basvuru" class="role-badge vet-yok">🩺 Veteriner başvurunu güncelle</a>`;
    }
  }
  const adminBadgeHtml = profile && profile.admin ? `<a href="/admin" class="role-badge admin">🛡️ Admin</a>` : "";

  const avatarHtml = profile && profile.profil_foto_url
    ? `<img src="${profile.profil_foto_url}" alt="Profil fotoğrafı">`
    : username.charAt(0).toUpperCase();

  // Kullanıcı adı değişim sınırı: 30 günde bir
  let usernameDegistirilebilir = true;
  let cooldownNoteHtml = "";
  if (profile && profile.kullanici_adi_degisim_tarihi) {
    const sonDegisim = new Date(profile.kullanici_adi_degisim_tarihi);
    const gunFarki = (Date.now() - sonDegisim.getTime()) / (1000 * 60 * 60 * 24);

      usernameDegistirilebilir = false;

function initBgSettings(profile) {
  const previewBox = document.getElementById("bg-preview-box");
  const removeBtn = document.getElementById("bg-remove-btn-settings");

  function refreshPreview(url) {
    if (url) {
      previewBox.style.backgroundImage = `url('${url}')`;
      previewBox.textContent = "";
      removeBtn.style.display = "inline-block";
    } else {
      previewBox.style.backgroundImage = "";
      previewBox.textContent = "Arka plan yok";
      removeBtn.style.display = "none";
    }
  }
  refreshPreview(profile && profile.arka_plan_url);

  document.getElementById("bg-upload-btn").addEventListener("click", () => document.getElementById("bg-file-input-settings").click());

  document.getElementById("bg-file-input-settings").addEventListener("change", async () => {
    const file = document.getElementById("bg-file-input-settings").files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      alert("Fotoğraf çok büyük (max 10MB).");
      return;
    }

    const msgBox = document.getElementById("bg-msg-box");
    msgBox.classList.remove("visible", "success", "error");
    const uploadBtn = document.getElementById("bg-upload-btn");
    uploadBtn.disabled = true; uploadBtn.textContent = "İşleniyor...";

    let compressed;
    try {
      compressed = await compressImage(file, 1600, 0.8);
    } catch (err) {
      msgBox.textContent = "Fotoğraf işlenemedi: " + err.message;
      msgBox.classList.add("visible", "error");
      uploadBtn.disabled = false; uploadBtn.textContent = "Fotoğraf seç";
      return;
    }

    const dosyaYolu = `${currentUserId}/arkaplan-${Date.now()}.jpg`;
    const { error: uploadError } = await supabaseClient.storage.from("ilan-fotograflari").upload(dosyaYolu, compressed);

    uploadBtn.disabled = false; uploadBtn.textContent = "Fotoğraf seç";

    if (uploadError) {
      msgBox.textContent = "Yüklenemedi: " + uploadError.message;
      msgBox.classList.add("visible", "error");
      return;
    }

    const { data: publicUrlData } = supabaseClient.storage.from("ilan-fotograflari").getPublicUrl(dosyaYolu);
    await supabaseClient.from("kullanici_profilleri").update({ arka_plan_url: publicUrlData.publicUrl }).eq("id", currentUserId);

    refreshPreview(publicUrlData.publicUrl);
    msgBox.textContent = "Sohbet arka planın güncellendi.";
    msgBox.classList.add("visible", "success");
  });

  removeBtn.addEventListener("click", async () => {
    await supabaseClient.from("kullanici_profilleri").update({ arka_plan_url: null }).eq("id", currentUserId);
    refreshPreview(null);
  });
}

  "Eskişehir","Gaziantep","Giresun","Gümüşhane","Hakkari","Hatay","Iğdır","Isparta","İstanbul","İzmir",
  "Kahramanmaraş","Karabük","Karaman","Kars","Kastamonu","Kayseri","Kırıkkale","Kırklareli","Kırşehir","Kilis",
  "Kocaeli","Konya","Kütahya","Malatya","Manisa","Mardin","Mersin","Muğla","Muş","Nevşehir",

].sort((a, b) => a.localeCompare(b, "tr"));

function setupCityAutocomplete(inputEl, listEl) {
  function render() {
    const q = inputEl.value.trim();
    if (!q) { listEl.classList.remove("visible"); listEl.innerHTML = ""; return; }
    const qLower = q.toLocaleLowerCase("tr-TR");
    const matches = TURKISH_CITIES.filter(c => c.toLocaleLowerCase("tr-TR").startsWith(qLower)).slice(0, 8);
    if (matches.length === 0) { listEl.classList.remove("visible"); listEl.innerHTML = ""; return; }
    listEl.innerHTML = matches.map(c => `<div class="autocomplete-item" data-val="${c}">${c}</div>`).join("");
    listEl.classList.add("visible");
    listEl.querySelectorAll(".autocomplete-item").forEach(item => {
      item.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        inputEl.value = item.dataset.val;
        listEl.classList.remove("visible");
        listEl.innerHTML = "";
      });
    });
  }
  inputEl.addEventListener("input", render);
  inputEl.addEventListener("focus", render);
  inputEl.addEventListener("blur", () => setTimeout(() => listEl.classList.remove("visible"), 120));
}

function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
          else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("Sıkıştırma başarısız")), "image/jpeg", quality);
      };
      img.onerror = () => reject(new Error("Fotoğraf okunamadı"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Dosya okunamadı"));
    reader.readAsDataURL(file);
  });
}

async function deleteAccountPermanently() {
  const msgBox = document.getElementById("delete-msg-box");
  msgBox.classList.remove("visible", "success", "error");

  const onayli1 = confirm("Hesabını KALICI olarak silmek istediğinden emin misin? Bu işlem geri alınamaz.");
  if (!onayli1) return;
  const onayli2 = confirm("Son kez soruyoruz: hesabın ve tüm verilerin (ilanların, randevuların, forum yazıların) tamamen silinecek. Devam edilsin mi?");
  if (!onayli2) return;

  const btn = document.getElementById("delete-btn");
  btn.disabled = true; btn.textContent = "Siliniyor...";

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    msgBox.textContent = "Oturum bulunamadı, lütfen tekrar giriş yap.";
    msgBox.classList.add("visible", "error");
    btn.disabled = false; btn.textContent = "Hesabımı Kalıcı Olarak Sil";
    return;
  }

  try {
    const res = await fetch("/api/hesap-sil", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ access_token: session.access_token }),
    });
    const data = await res.json();

    if (!res.ok || data.status !== "basarili") {
      throw new Error(data.mesaj || "Bilinmeyen hata");
    }

    await supabaseClient.auth.signOut();
    window.location.href = "/";
  } catch (err) {
    btn.disabled = false; btn.textContent = "Hesabımı Kalıcı Olarak Sil";
    msgBox.textContent = "Silinemedi: " + err.message;
    msgBox.classList.add("visible", "error");
  }
}

  if (error) {
    msgBox.textContent = "Kaydedilemedi: " + error.message;
    msgBox.classList.add("visible", "error");
    return;
  }

  msgBox.textContent = "Kullanıcı adın güncellendi. Bir sonraki değişiklik için 30 gün beklemen gerekecek.";
  msgBox.classList.add("visible", "success");
  document.querySelector(".profile-header-name").textContent = yeniAd;
  document.getElementById("username-input").disabled = true;
  btn.disabled = true;
}

document.getElementById("mobile-menu-panel").innerHTML = document.querySelector(".nav-links").innerHTML;
document.getElementById("mobile-menu-btn").addEventListener("click", () => {
  document.getElementById("mobile-menu-panel").classList.toggle("visible");
});

initSession();
</script>
</body>
</html>
