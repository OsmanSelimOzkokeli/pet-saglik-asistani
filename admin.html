<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Paneli — Pati Sağlık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #F1F7F4; --card: #FFFFFF; --ink: #14231F; --ink-soft: #54655D; --ink-faint: #8A9C92;
    --teal: #0B6E6C; --teal-bright: #12968F; --teal-soft: #E1F0EE;
    --green: #6E9B37; --green-soft: #EAF3E1;
    --line: #DCE7E0; --acil: #B8433A; --acil-bg: #FBEAE8; --yakinda: #B9791E; --yakinda-bg: #FBF1E1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  .navbar { position: sticky; top: 0; z-index: 20; background: rgba(241, 247, 244, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .navbar-inner { max-width: 980px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--teal); letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; gap: 20px; }
  .nav-links a { font-size: 13.5px; font-weight: 500; color: var(--ink-soft); text-decoration: none; }
  .nav-links a:hover { color: var(--teal); }
  @media (max-width: 760px) { .nav-links { display: none; } }
  .nav-auth { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nav-avatar { width: 30px; height: 30px; border-radius: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--teal-soft); color: var(--teal); font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px; text-decoration: none; flex-shrink: 0; }
  .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .notif-wrap { position: relative; }
  .notif-bell { font-size: 18px; cursor: pointer; position: relative; padding: 2px 4px; }
  .notif-badge { position: absolute; top: -3px; right: -3px; background: var(--acil); color: #fff; font-size: 10px; font-weight: 700; border-radius: 100px; padding: 1px 5px; display: none; line-height: 1.3; }
  .notif-badge.visible { display: block; }
  .notif-dropdown { position: absolute; top: 100%; right: 0; margin-top: 10px; width: 300px; max-height: 340px; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 28px rgba(20,35,31,0.16); display: none; z-index: 50; }
  .notif-dropdown.visible { display: block; }
  .notif-item { padding: 12px 15px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; color: var(--ink); line-height: 1.4; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-soft); font-weight: 600; }
  .notif-item .notif-time { display: block; font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 3px; }
  .notif-empty { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 13px; }
  .nav-auth .who { color: var(--ink); font-weight: 600; }
  .nav-auth a, .nav-auth span.action { color: var(--teal-bright); font-weight: 600; text-decoration: none; cursor: pointer; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px 60px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 10px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; margin: 0 0 6px; color: var(--teal); }
  .sub { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 22px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn { padding: 9px 16px; border-radius: 100px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .tab-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .listing-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; gap: 16px; margin-bottom: 12px; }
  .listing-photo { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--teal-soft); flex-shrink: 0; }
  .listing-info { flex: 1; min-width: 0; }
  .listing-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
  .listing-meta { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 6px; }
  .listing-desc { font-size: 13.5px; color: var(--ink); line-height: 1.5; margin-bottom: 8px; }
  .listing-contact { font-size: 12.5px; color: var(--teal); font-weight: 600; margin-bottom: 10px; }

  .status-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; margin-bottom: 8px; }
  .status-badge.beklemede { background: var(--yakinda-bg); color: var(--yakinda); }
  .status-badge.onaylı { background: var(--green-soft); color: #3F5A22; }
  .status-badge.reddedildi { background: var(--acil-bg); color: var(--acil); }

  .section-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .section-tab-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .section-tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .info-line { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .info-line strong { color: var(--ink); }

  .action-row { display: flex; gap: 8px; }
  .action-btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .approve-btn { background: var(--teal); color: #fff; }
  .approve-btn:hover { background: var(--teal-bright); }
  .reject-btn { background: var(--acil-bg); color: var(--acil); }
  .reject-btn:hover { background: #F5D5D2; }
  .action-btn:disabled { opacity: 0.5; cursor: wait; }

  .empty-state { text-align: center; color: var(--ink-faint); font-size: 14px; padding: 40px 20px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; }
  .denied-box { background: var(--acil-bg); color: var(--acil); border-radius: 12px; padding: 20px; font-size: 14px; text-align: center; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M6 18C6 13 10 9 16 9C22 9 26 13 26 18C26 23 21 26 16 26C11 26 6 23 6 18Z" stroke="#0B6E6C" stroke-width="2"/>
        <path d="M11 16L14 20L16 15L18 20L21 16" stroke="#6E9B37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Pati Sağlık</span>
    </a>
    <div class="nav-links">
      <a href="/">Asistana Sor</a>
      <a href="/rehber">Veteriner &amp; petshop</a>
      <a href="/randevu-al">Randevu Al</a>
      <a href="/veteriner-sor">Veterinere Sor</a>
      <a href="/sahiplendir">Sahiplendirme</a>
      <a href="/forum">Forum</a>
    </div>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div class="wrap">
  <div class="eyebrow">Yönetim</div>
  <h1>Admin paneli</h1>
  <p class="sub">Sahiplendirme ilanlarını ve veteriner başvurularını incele, onayla ya da reddet.</p>

  <div class="section-tabs" id="section-tabs">
    <button class="section-tab-btn active" data-section="ilanlar">🐾 İlanlar</button>
    <button class="section-tab-btn" data-section="veterinerler">🩺 Veteriner Başvuruları</button>
  </div>

  <div id="content">
    <div class="empty-state">Yükleniyor...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://qkvxlnlsdzmcozwkvbgf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdnhsbmxzZHptY296d2t2YmdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjEyNzEsImV4cCI6MjEwMTkzNzI3MX0.CUF-vLEVwGmlZWH4iUzGSpUEfLlXc-z-J0lvTwp_56E";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;
let allListings = [];
let activeTab = "beklemede";

async function initSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const navAuth = document.getElementById("nav-auth");

  if (!session) {
    navAuth.innerHTML = `<a href="/giris">Giriş yap</a>`;
    document.getElementById("section-tabs").style.display = "none";
    showDenied("Bu sayfayı görmek için giriş yapman gerekiyor.");
    return;
  }

  currentUserId = session.user.id;
  const { data: profile } = await supabaseClient.from("kullanici_profilleri").select("kullanici_adi, admin, veteriner, profil_foto_url").eq("id", session.user.id).single();
  const username = profile ? profile.kullanici_adi : session.user.email;
    const avatarHtml = profile && profile.profil_foto_url
      ? `<img src="${profile.profil_foto_url}" alt="">`
      : username.charAt(0).toUpperCase();
  const vetLink = profile
    ? (profile.veteriner
        ? `<a href="/veteriner-takvim" style="margin-right:4px;">Müsaitlik Takvimim</a>`
        : `<a href="/veteriner-basvuru" style="margin-right:4px;">Veteriner misin?</a>`)
    : "";
  navAuth.innerHTML = `
    <div class="notif-wrap" id="notif-wrap">
      <span class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge"></span></span>
      <div class="notif-dropdown" id="notif-dropdown"></div>
    </div>
    ${vetLink}<a href="/randevularim" style="margin-right:4px;">Randevularım</a><span class="action" id="logout-action">Çıkış yap</span><a href="/hesabim" class="nav-avatar" title="${username}">${avatarHtml}</a>`;
  document.getElementById("logout-action").addEventListener("click", async () => { await supabaseClient.auth.signOut(); window.location.reload(); });
  setupNotifications();

  if (!profile || !profile.admin) {
    document.getElementById("section-tabs").style.display = "none";
    showDenied("Bu sayfaya erişim yetkin yok.");
    return;
  }

  document.querySelectorAll("#section-tabs .section-tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#section-tabs .section-tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (btn.dataset.section === "ilanlar") loadListings();
      else loadVetApplications();
    });
  });

  await loadListings();
}

function setupNotifications() {
  document.getElementById("notif-bell").addEventListener("click", async (e) => {
    e.stopPropagation();
    const dropdown = document.getElementById("notif-dropdown");
    const willOpen = !dropdown.classList.contains("visible");
    dropdown.classList.toggle("visible");
    if (willOpen) await loadNotifications();
  });
  document.addEventListener("click", () => document.getElementById("notif-dropdown").classList.remove("visible"));
  refreshNotifBadge();
}

async function refreshNotifBadge() {
  const { count } = await supabaseClient.from("bildirimler").select("id", { count: "exact", head: true }).eq("kullanici_id", currentUserId).eq("okundu", false);
  const badge = document.getElementById("notif-badge");
  if (count && count > 0) { badge.textContent = count > 9 ? "9+" : count; badge.classList.add("visible"); }
  else { badge.classList.remove("visible"); }
}

async function loadNotifications() {
  const dropdown = document.getElementById("notif-dropdown");
  const { data } = await supabaseClient.from("bildirimler").select("*").eq("kullanici_id", currentUserId).order("created_at", { ascending: false }).limit(10);
  if (!data || data.length === 0) { dropdown.innerHTML = '<div class="notif-empty">Henüz bildirimin yok.</div>'; return; }
  dropdown.innerHTML = data.map(n => `
    <div class="notif-item ${n.okundu ? "" : "unread"}" data-id="${n.id}" data-link="${n.link || ""}">
      ${n.mesaj}
      <span class="notif-time">${new Date(n.created_at).toLocaleString("tr-TR")}</span>
    </div>
  `).join("");
  dropdown.querySelectorAll(".notif-item").forEach(item => {
    item.addEventListener("click", async () => {
      await supabaseClient.from("bildirimler").update({ okundu: true }).eq("id", item.dataset.id);
      if (item.dataset.link) window.location.href = item.dataset.link;
    });
  });
  refreshNotifBadge();
}

function showDenied(msg) {
  document.getElementById("content").innerHTML = `<div class="denied-box">${msg}</div>`;
}

async function loadListings() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-val="beklemede">Beklemede</button>
      <button class="tab-btn" data-val="onaylı">Onaylı</button>
      <button class="tab-btn" data-val="reddedildi">Reddedildi</button>
      <button class="tab-btn" data-val="tumu">Tümü</button>
    </div>
    <div id="listing-list"><div class="empty-state">Yükleniyor...</div></div>
  `;

  document.querySelectorAll("#tabs .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tabs .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.dataset.val;
      renderListings();
    });
  });

  const { data, error } = await supabaseClient
    .from("sahiplendirme_ilanlari")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("listing-list").innerHTML = `<div class="empty-state">Yüklenemedi: ${error.message}</div>`;
    return;
  }

  allListings = data || [];
  renderListings();
}

function renderListings() {
  const list = document.getElementById("listing-list");
  const filtered = activeTab === "tumu" ? allListings : allListings.filter(i => i.durum === activeTab);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">Bu kategoride ilan yok.</div>';
    return;
  }

  list.innerHTML = "";
  filtered.forEach(ilan => {
    const card = document.createElement("div");
    card.className = "listing-card";
    const photoHtml = ilan.fotograf_url
      ? `<img class="listing-photo" src="${ilan.fotograf_url}" alt="${ilan.hayvan_adi}">`
      : `<div class="listing-photo"></div>`;

    const ilanTuru = ilan.ilan_turu === "çiftleştirme" ? "💞 Çiftleştirme" : "🏠 Sahiplendirme";

    card.innerHTML = `
      ${photoHtml}
      <div class="listing-info">
        <span class="status-badge ${ilan.durum}">${ilan.durum}</span>
        <div class="listing-name">${ilan.hayvan_adi} · ${ilan.tur} · ${ilanTuru}</div>
        <div class="listing-meta">${[ilan.yas, ilan.cinsiyet, ilan.konum].filter(Boolean).join(" · ")}</div>
        <div class="listing-desc">${ilan.aciklama}</div>
        <div class="listing-contact">📞 ${ilan.iletisim}</div>
        <div class="action-row">
          <button class="action-btn approve-btn" data-id="${ilan.id}" data-action="onaylı">Onayla</button>
          <button class="action-btn reject-btn" data-id="${ilan.id}" data-action="reddedildi">Reddet</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", () => updateStatus(btn.dataset.id, btn.dataset.action, btn));
  });
}

async function updateStatus(id, yeniDurum, btnEl) {
  const card = btnEl.closest(".listing-card");
  card.querySelectorAll(".action-btn").forEach(b => b.disabled = true);

  const { error } = await supabaseClient.from("sahiplendirme_ilanlari").update({ durum: yeniDurum }).eq("id", id);

  if (error) {
    alert("Güncellenemedi: " + error.message);
    card.querySelectorAll(".action-btn").forEach(b => b.disabled = false);
    return;
  }

  const item = allListings.find(i => i.id === id);
  if (item) item.durum = yeniDurum;
  renderListings();
}

let allVetApplications = [];
let activeVetTab = "beklemede";

async function loadVetApplications() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="tabs" id="vet-tabs">
      <button class="tab-btn active" data-val="beklemede">Beklemede</button>
      <button class="tab-btn" data-val="onaylı">Onaylı</button>
      <button class="tab-btn" data-val="reddedildi">Reddedildi</button>
      <button class="tab-btn" data-val="tumu">Tümü</button>
    </div>
    <div id="vet-list"><div class="empty-state">Yükleniyor...</div></div>
  `;

  document.querySelectorAll("#vet-tabs .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#vet-tabs .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeVetTab = btn.dataset.val;
      renderVetApplications();
    });
  });

  const { data, error } = await supabaseClient
    .from("veteriner_basvurulari")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("vet-list").innerHTML = `<div class="empty-state">Yüklenemedi: ${error.message}</div>`;
    return;
  }

  allVetApplications = data || [];
  renderVetApplications();
}

function renderVetApplications() {
  const list = document.getElementById("vet-list");
  const filtered = activeVetTab === "tumu" ? allVetApplications : allVetApplications.filter(b => b.durum === activeVetTab);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">Bu kategoride başvuru yok.</div>';
    return;
  }

  list.innerHTML = "";
  filtered.forEach(basvuru => {
    const card = document.createElement("div");
    card.className = "listing-card";
    card.innerHTML = `
      <div class="listing-info">
        <span class="status-badge ${basvuru.durum}">${basvuru.durum}</span>
        <div class="listing-name">${basvuru.klinik_adi}</div>
        <div class="info-line"><strong>Adres:</strong> ${basvuru.adres}</div>
        <div class="info-line"><strong>Telefon:</strong> ${basvuru.telefon}</div>
        ${basvuru.uzmanlik ? `<div class="info-line"><strong>Uzmanlık:</strong> ${basvuru.uzmanlik}</div>` : ""}
        ${basvuru.diploma_no ? `<div class="info-line"><strong>Diploma/Sicil no:</strong> ${basvuru.diploma_no}</div>` : ""}
        <div class="action-row" style="margin-top:10px;">
          <button class="action-btn approve-btn" data-id="${basvuru.id}" data-user="${basvuru.kullanici_id}" data-action="onaylı">Onayla</button>
          <button class="action-btn reject-btn" data-id="${basvuru.id}" data-user="${basvuru.kullanici_id}" data-action="reddedildi">Reddet</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll(".action-btn").forEach(btn => {
    btn.addEventListener("click", () => updateVetApplication(btn.dataset.id, btn.dataset.user, btn.dataset.action, btn));
  });
}

async function updateVetApplication(id, kullaniciId, yeniDurum, btnEl) {
  const card = btnEl.closest(".listing-card");
  card.querySelectorAll(".action-btn").forEach(b => b.disabled = true);

  const { error: basvuruError } = await supabaseClient.from("veteriner_basvurulari").update({ durum: yeniDurum }).eq("id", id);
  if (basvuruError) {
    alert("Güncellenemedi: " + basvuruError.message);
    card.querySelectorAll(".action-btn").forEach(b => b.disabled = false);
    return;
  }

  if (yeniDurum === "onaylı") {
    const { error: profilError } = await supabaseClient.from("kullanici_profilleri").update({ veteriner: true }).eq("id", kullaniciId);
    if (profilError) {
      alert("Başvuru güncellendi ama kullanıcı veteriner olarak işaretlenemedi: " + profilError.message);
    }
  }

  const item = allVetApplications.find(b => b.id === id);
  if (item) item.durum = yeniDurum;
  renderVetApplications();
}

initSession();
</script>
</body>
</html>
